<!DOCTYPE html>

<body>
    <div class="content_block">
        <h1>可视化技术实验2结果</h1>
        <div class="graph_block">
            <h1>标准的可视化图表</h1>
            <div id="chart-standard"></div>
            <h1>欺骗的可视化图表</h1>
            <div id="chart-fake"></div>
        </div>
    </div>
<script type="module">

import define from "./index.js";
import {Runtime, Library, Inspector} from "./runtime.js";

const runtime = new Runtime();
const main = runtime.module(define, name => {
    if (name === "chart") return new Inspector(document.querySelector(`#chart-standard`));
    if (name === "chart_fake") return new Inspector(document.querySelector('#chart-fake'));
    return true;
});

</script>
